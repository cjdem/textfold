# The website, https://cjdem.github.io/textfold/: the download, install and usage page in English and Chinese
# (site/build.py). Built and served by GitHub Pages when the site or this file changes on main; run it by hand
# (Actions › site › Run workflow) after other changes.
# Pages must serve from GitHub Actions (Settings › Pages › Source); with a branch as the source, deploy-pages fails.
name: site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write   # what the Pages deployment signs in with

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
