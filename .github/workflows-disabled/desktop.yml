# The app: Windows (not signed yet: SmartScreen asks once, More info › Run anyway).
# It is built on its own system, since the Python it ships and its packages are that system's, and that Python runs
# TextFold's tests and reads files before anything is packed (desktop/scripts/smoke.py).
# A version tag (v0.10.2) builds it into a draft release, published once it has succeeded; run by hand
# (Actions › desktop › Run workflow) it is kept as the run's artifacts.
# The release also carries what the installed app updates from (desktop/main.js): latest.yml, and its blockmap,
# for a download of what changed.
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "The app's version alone, for a test of its updates (an older build and a newer one); empty: the code's"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One version, in the code, the app and the tag
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' textfold/__init__.py)
          app=$(node -p "require('./desktop/package.json').version")
          test "$code" = "$app" || { echo "textfold $code, desktop/package.json $app"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$code" || { echo "tag $GITHUB_REF_NAME, code $code"; exit 1; }
          fi
      - name: A draft release, filled by the build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --draft --title "TextFold ${TAG#v}" --notes "Building the app."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest, script: 'dist:win' }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - name: npm run ${{ matrix.script }}
        working-directory: desktop
        shell: bash
        run: npm run ${{ matrix.script }} ${VERSION:+-- -c.extraMetadata.version=$VERSION}
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the payload script asks GitHub for the newest CPython build
      - name: The bundled Python runs the tests, reads files and serves the reader
        working-directory: desktop
        shell: bash
        run: payload/python/python.exe scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: textfold-${{ matrix.name }}
          path: |
            desktop/out/*.exe
            desktop/out/*.blockmap
            desktop/out/latest*.yml
          if-no-files-found: error
      - name: Into the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/out/*.exe desktop/out/*.blockmap)
          [ -f desktop/out/latest.yml ] && files+=(desktop/out/latest.yml)
          gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: The release, once the app is in it
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "$TAG" -R "$REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
