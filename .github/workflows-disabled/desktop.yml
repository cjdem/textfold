# The MyGo app: Windows (not signed yet: SmartScreen asks once, More info › Run anyway).
# It is built on its own system, since the Python it ships and its packages are that system's. The payload's Python
# starts the server before anything is packed (desktop-mygo/scripts/smoke.py).
# A version tag builds it into a draft release; run by hand (Actions › desktop › Run workflow) it is kept as the
# run's artifacts. The release carries the signed MyGo update manifest and archive the installed app updates from;
# the old Electron latest.yml is not compatible, so a copy installed before the MyGo switch needs one manual install.
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One version, in the code, the app and the tag
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' textfold/__init__.py)
          app=$(node -p "require('./desktop-mygo/mygo.json').version")
          test "$code" = "$app" || { echo "textfold $code, desktop-mygo/mygo.json $app"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$code" || { echo "tag $GITHUB_REF_NAME, code $code"; exit 1; }
          fi
      - name: A draft release, filled by the build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --draft --title "TextFold ${TAG#v}" --notes "Building the app."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, os: windows-latest, script: 'dist:win' }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-mygo/go.mod
          cache-dependency-path: desktop-mygo/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare the bundled Python
        run: node desktop-mygo/scripts/prepare-payload.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the payload script asks GitHub for the newest CPython build
      - name: Go shell tests
        working-directory: desktop-mygo
        run: |
          go test ./...
          go vet ./...
      - name: A release needs the update signing key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "MYGO_UPDATER_PRIVATE_KEY is not set"; exit 1; }
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      - name: Build TextFold
        working-directory: desktop-mygo
        run: go tool mygo build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      - name: The bundled Python starts the server
        run: desktop-mygo/resources/payload/python/python.exe desktop-mygo/scripts/smoke.py
      - name: Give the installer the download page's stable name
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop-mygo/build/windows-amd64 -Filter 'TextFold Setup *.exe' | Select-Object -First 1
          if (-not $installer) { throw 'MyGo produced no installer' }
          Copy-Item -LiteralPath $installer.FullName -Destination desktop-mygo/build/windows-amd64/TextFold-win-x64-setup.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: textfold-${{ matrix.name }}
          path: |
            desktop-mygo/build/windows-amd64/TextFold-win-x64-setup.exe
            desktop-mygo/build/windows-amd64/update-*.json
            desktop-mygo/build/windows-amd64/*.tar.gz
            desktop-mygo/build/windows-amd64/*.delta
          if-no-files-found: error
      - name: Into the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $files = Get-ChildItem desktop-mygo/build/windows-amd64 -File |
            Where-Object { $_.Name -eq 'TextFold-win-x64-setup.exe' -or $_.Name -like 'update-*.json' -or $_.Extension -in '.gz', '.delta' }
          if (-not $files) { throw 'MyGo produced nothing to release' }
          gh release upload "$env:TAG" $files.FullName -R "$env:REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: The release, once the app is in it
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "$TAG" -R "$REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
