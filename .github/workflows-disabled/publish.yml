# TextFold to PyPI, when a version is tagged (v0.10.0): built here, uploaded through PyPI's trusted publishing, so that
# no token is kept anywhere. The tag must name the version the code says it is (textfold/__init__.py).
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the version
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' textfold/__init__.py)
          test "${GITHUB_REF_NAME#v}" = "$code" || { echo "tag $GITHUB_REF_NAME, code $code"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # what trusted publishing signs in with
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
