[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textfold"
dynamic = ["version"]
description = "Zoom any text from every word to a one-screen map: papers, READMEs, Wikipedia and project material"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Xia Chen" }, { name = "cjdem" }]
keywords = ["reading", "stretchtext", "semantic zoom", "arxiv", "summarization", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "beautifulsoup4",
    "lxml",
    "Pillow",
    "markdown-it-py",
    "mdit-py-plugins",
    "latex2mathml",
    "trafilatura>=2.0",
    "lxml_html_clean",   # trafilatura needs it (through justext's lxml[html_clean]), which an older pip leaves out
    "mammoth",
    "openpyxl",
    "pypdfium2>=4.30,<5.12",   # MinerU's block boxes turn into figures cut from the PDF's pages
]

[project.optional-dependencies]
# only for the Anthropic API (Claude Code, Codex, Pi and OpenAI-compatible providers need nothing more)
anthropic = ["anthropic"]

[project.scripts]
textfold = "textfold.__main__:main"

[project.urls]
Homepage = "https://github.com/cjdem/textfold"
Website = "https://cjdem.github.io/textfold/"
Issues = "https://github.com/cjdem/textfold/issues"

[tool.setuptools]
packages = ["textfold"]

[tool.setuptools.dynamic]
version = { attr = "textfold.__version__" }

[tool.setuptools.package-data]
textfold = ["web/*", "web/**/*"]
